# Publish to RubyGems using the official release-gem action (Trusted Publishing).
# Run this workflow manually after bumping version and pushing to main. Tests run first.
name: Release
on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Test and push gem to RubyGems.org
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for RubyGems Trusted Publishing
      contents: write   # required for rake release to push the release tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      - name: Install gems
        run: bundle install
        env:
          BUNDLE_FROZEN: "true"
      - name: Run tests
        run: bundle exec rake
      - name: Publish to RubyGems.org
        uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
      - name: Set release tag and notes
        id: tag
        run: |
          VERSION=$(ruby -e "require './lib/mailsmtp/version'; puts MailSmtp::VERSION")
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          awk -v ver="$VERSION" '
            $0 == "## " ver { keep = 1 }
            keep && /^## / && $0 != "## " ver { keep = 0 }
            keep { print }
          ' CHANGELOG.md > release-notes.md
      - name: Create GitHub Release # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: pkg/mailsmtp-*.gem
          body_path: release-notes.md
          generate_release_notes: false
