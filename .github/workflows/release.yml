# Publish to RubyGems using the official release-gem action (Trusted Publishing).
# Run this workflow manually after bumping version and pushing to main. Tests run first.
name: Release
on:
  workflow_dispatch:
jobs:
  release:
    name: Test and push gem to RubyGems.org
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for RubyGems Trusted Publishing
      contents: write   # required for rake release to push the release tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake
      - name: Publish to RubyGems.org
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
      - name: Set release tag and notes
        id: tag
        run: |
          VERSION=$(ruby -e "require './lib/mailsmtp/version'; puts MailSmtp::VERSION")
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          awk -v ver="$VERSION" '
            $0 == "## " ver { keep = 1 }
            keep && /^## / && $0 != "## " ver { keep = 0 }
            keep { print }
          ' CHANGELOG.md > release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: pkg/mailsmtp-*.gem
          body_path: release-notes.md
          generate_release_notes: false
